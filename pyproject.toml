[project]
name = "scraper"
version = "0.1.0"
description = "A Google scholar bibliography scraper for Zotero"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bs4>=0.0.2",
  "pandas>=2.3.2",
  "pyperclip>=1.9.0",
  "python-dotenv>=1.0.0",
  "pyzotero>=1.6.11",
  "rich>=14.1.0",
  "scholarly>=1.7.11",
  "selenium>=4.34.2",
  "toml>=0.10.2",
  "undetected-chromedriver>=3.5.5",
]

[project.scripts]
bib-scraper = "scraper.cli:main"

[build-system]
requires = ["uv_build >= 0.7.19, <0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipython>=8.37.0"]
